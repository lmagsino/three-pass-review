<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">How threepass reviews a diff</title>
  <desc id="d">The diff and PR text go to a context builder, which makes one frozen input. Three passes, correctness, security and data safety, and architecture and conventions, each review it independently and never see each other's output. A reconciler merges, scores, ranks and caps the findings into one comment that reports its cost. A cost ceiling is enforced throughout.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #f5f7f6; } .card { fill: #ffffff; stroke: #d8dee2; } .ink { fill: #17212b; } .muted { fill: #55626e; }
    .rule { stroke: #b9c2c9; } .rulefill { fill: #b9c2c9; } .inkstroke { stroke: #17212b; } .inkfill { fill: #17212b; }
    .g { fill: #1a7f4b; } .gbg { fill: #e5f3eb; } .gs { stroke: #1a7f4b; }
    .v { fill: #5b34a3; } .vbg { fill: #eee8f8; } .vs { stroke: #5b34a3; }
    .a { fill: #8a5a00; } .abg { fill: #fbf0d9; } .as { stroke: #8a5a00; }
    .onfill { fill: #ffffff; } .onstroke { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121a21; } .card { fill: #19232c; stroke: #2b3843; } .ink { fill: #e7ecef; } .muted { fill: #9aa7b2; }
      .rule { stroke: #3d4c58; } .rulefill { fill: #3d4c58; } .inkstroke { stroke: #e7ecef; } .inkfill { fill: #e7ecef; }
      .g { fill: #4cc38a; } .gbg { fill: #15392a; } .gs { stroke: #4cc38a; }
      .v { fill: #b49af0; } .vbg { fill: #2d2547; } .vs { stroke: #b49af0; }
      .a { fill: #e2b04a; } .abg { fill: #3a2f17; } .as { stroke: #e2b04a; }
      .onfill { fill: #121a21; } .onstroke { stroke: #121a21; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="inkfill" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="20"/>
  <text class="ink" x="40" y="46" font-size="22" font-weight="700">One diff, three independent passes, one comment</text>

  <g fill="none" stroke-width="2" class="inkstroke">
    <path d="M190 278 H217" marker-end="url(#ah)"/>
    <path d="M405 278 H425 V118 H442" marker-end="url(#ah)"/>
    <path d="M405 278 H442" marker-end="url(#ah)"/>
    <path d="M405 278 H425 V438 H442" marker-end="url(#ah)"/>
    <path d="M690 118 H715 V278 H737" marker-end="url(#ah)"/>
    <path d="M690 278 H737" marker-end="url(#ah)"/>
    <path d="M690 438 H715 V278 H737" marker-end="url(#ah)"/>
    <path d="M935 278 H977" marker-end="url(#ah)"/>
  </g>

  <rect class="card" x="40" y="230" width="150" height="96" rx="12" stroke-width="1.5"/>
  <text class="ink" x="115" y="272" font-size="18" font-weight="700" text-anchor="middle">Diff</text>
  <text class="muted" x="115" y="297" font-size="14" text-anchor="middle">+ PR title, body</text>

  <rect class="card" x="225" y="230" width="180" height="96" rx="12" stroke-width="1.5"/>
  <text class="ink" x="315" y="272" font-size="18" font-weight="700" text-anchor="middle">Context builder</text>
  <text class="muted" x="315" y="297" font-size="14" text-anchor="middle">one frozen input</text>

  <rect class="card" x="450" y="70" width="240" height="96" rx="12" stroke-width="1.5"/>
  <text class="ink" x="570" y="110" font-size="18" font-weight="700" text-anchor="middle">Correctness</text>
  <text class="muted" x="570" y="135" font-size="14" text-anchor="middle">Does it do what the PR says?</text>

  <text class="muted" x="570" y="203" font-size="13" font-style="italic" text-anchor="middle">can't see the other passes</text>

  <rect class="card" x="450" y="230" width="240" height="96" rx="12" stroke-width="1.5"/>
  <text class="ink" x="570" y="270" font-size="18" font-weight="700" text-anchor="middle">Security &amp; data safety</text>
  <text class="muted" x="570" y="295" font-size="14" text-anchor="middle">Injection, authz, PII, SSRF</text>

  <text class="muted" x="570" y="363" font-size="13" font-style="italic" text-anchor="middle">can't see the other passes</text>

  <rect class="card" x="450" y="390" width="240" height="96" rx="12" stroke-width="1.5"/>
  <text class="ink" x="570" y="430" font-size="18" font-weight="700" text-anchor="middle">Architecture</text>
  <text class="muted" x="570" y="455" font-size="14" text-anchor="middle">Fits this codebase?</text>

  <rect class="vbg" x="745" y="230" width="190" height="96" rx="12"/>
  <rect class="vs" x="745" y="230" width="190" height="96" rx="12" fill="none" stroke-width="1.5"/>
  <text class="v" x="840" y="272" font-size="18" font-weight="700" text-anchor="middle">Reconciler</text>
  <text class="muted" x="840" y="297" font-size="14" text-anchor="middle">merge, score, rank</text>

  <rect class="gbg" x="985" y="230" width="175" height="96" rx="12"/>
  <rect class="gs" x="985" y="230" width="175" height="96" rx="12" fill="none" stroke-width="1.5"/>
  <text class="g" x="1072" y="272" font-size="18" font-weight="700" text-anchor="middle">One comment</text>
  <text class="muted" x="1072" y="297" font-size="14" text-anchor="middle">with its cost</text>

  <rect class="abg" x="745" y="390" width="415" height="96" rx="12"/>
  <rect class="as" x="745" y="390" width="415" height="96" rx="12" fill="none" stroke-width="1.5"/>
  <text class="a" x="952" y="428" font-size="18" font-weight="700" text-anchor="middle">Cost ceiling</text>
  <text class="muted" x="952" y="455" font-size="14" text-anchor="middle">Estimated before calling. Never exceeded. Reported.</text>
</svg>
