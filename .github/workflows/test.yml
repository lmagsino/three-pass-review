# Runs the guide kit's tier-rule tests. (The Ruby tool adds its own job in milestone M0.)
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
        working-directory: guide
