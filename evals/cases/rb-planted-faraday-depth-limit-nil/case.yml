pr:
  title: 'Backport GHSA-98m9-hrrm-r99r fix to 1.x: add param_depth_limit to NestedParamsEncoder'
  body: |
    The 1.x branch is equally affected by the DoS vulnerability in `NestedParamsEncoder` where arbitrarily deep nested query parameters could be used to exhaust resources. This backports the fix from `36764bfc`.

    ### Changes

    - **`NestedParamsEncoder`**: adds `param_depth_limit` accessor (default: `100`); raises `Faraday::Error` when exceeded, can be disabled with `nil`
    - **`DecodeMethods#decode_pair`**: validates depth via `validate_params_depth!` before processing subkeys
    - **Tests**: depth limit enforcement, within-limit, and disabled-limit cases for both the encoder and `Connection#build_url`

    ```ruby
    # Default: raises after 100 levels of nesting
    Faraday::NestedParamsEncoder.decode('a' + '[b]' * 101 + '=1')
    # => Faraday::Error: exceeded nested parameter depth limit of 100

    # Configurable
    Faraday::NestedParamsEncoder.param_depth_limit = 5

    # Disable entirely
    Faraday::NestedParamsEncoder.param_depth_limit = nil
    ```
