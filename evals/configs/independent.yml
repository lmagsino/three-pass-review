# The product: three passes in parallel on the same frozen input; none sees another's output.
mode: independent
runs: 3
# Training data cutoff of the model below, from Anthropic's models overview (checked 2026-10-01).
# Recall is also reported separately for cases merged before and after it.
model_training_cutoff: "2026-06"
# Overrides on top of lib/three_pass_review/defaults.yml (model, ceiling, threshold, ...).
threepass: {}
