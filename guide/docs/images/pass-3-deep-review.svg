<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">Pass 3: deep review</title>
  <desc id="d">Only for pull requests the tier check routes deep. First, the AI does the reading: from the deep-tier PR, threepass computes a change map from the diff, writes a brief (the change, impact, risks, rollback, tests and questions), and runs three independent checks for correctness, security and architecture. Together they become one reviewer brief comment. In the example it says the PR replaces dismiss() with requestChanges(), maps the change to src/reviews and src/ui with a deleted file, and says to look first at actions.ts line 88, where dismiss() is still called. Then people do the judgment: the code owner and a second reviewer start from the brief, verify the tests, check every changed contract, confirm the change can be rolled back, and sign off using the pre-filled draft. The review-gate check needs two approvals of the latest commit before merge. The brief never approves or blocks.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="inkfill" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
    .bg { fill: #f5f7f6; } .card { fill: #ffffff; stroke: #d8dee2; } .ink { fill: #17212b; } .muted { fill: #55626e; } .faint { fill: #6e7a85; }
    .rule { stroke: #d8dee2; } .inkfill { fill: #17212b; } .inkline { stroke: #17212b; fill: none; stroke-width: 2; } .onink { fill: #ffffff; }
    .g { fill: #1a7f4b; } .gbg { fill: #e5f3eb; } .gs { stroke: #1a7f4b; }
    .v { fill: #5b34a3; } .vbg { fill: #eee8f8; } .vs { stroke: #5b34a3; }
    .a { fill: #8a5a00; } .abg { fill: #fbf0d9; } .as { stroke: #c08a1e; }
    .r { fill: #b42318; }
    .pill { fill: none; stroke: #b9c2c9; } .pillon { fill: #17212b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121a21; } .card { fill: #19232c; stroke: #2b3843; } .ink { fill: #e7ecef; } .muted { fill: #9aa7b2; } .faint { fill: #85929e; }
      .rule { stroke: #2b3843; } .inkfill { fill: #e7ecef; } .inkline { stroke: #e7ecef; } .onink { fill: #121a21; }
      .g { fill: #4cc38a; } .gbg { fill: #173528; } .gs { stroke: #4cc38a; }
      .v { fill: #b49af0; } .vbg { fill: #2d2547; } .vs { stroke: #b49af0; }
      .a { fill: #e2b04a; } .abg { fill: #3a2f17; } .as { stroke: #e2b04a; }
      .r { fill: #f47067; }
      .pill { stroke: #3d4c58; } .pillon { fill: #e7ecef; }
    }
  </style>

  <rect class="bg" width="1200" height="720" rx="20"/>

  <text class="ink" x="48" y="64" font-size="27" font-weight="700">Pass 3 · Deep review</text>
  <text class="muted" x="48" y="94" font-size="16">Only for risky PRs. An AI brief does the reading, so people can spend their time on judgment.</text>

  <rect class="pill" x="866" y="42" width="90" height="30" rx="15"/>
  <text class="muted" x="911" y="62" font-size="13" text-anchor="middle">1 Auto</text>
  <rect class="pill" x="964" y="42" width="90" height="30" rx="15"/>
  <text class="muted" x="1009" y="62" font-size="13" text-anchor="middle">2 Light</text>
  <rect class="pillon" x="1062" y="42" width="90" height="30" rx="15"/>
  <text class="onink" x="1107" y="62" font-size="13" font-weight="700" text-anchor="middle">3 Deep</text>

  <!-- row 1: the AI does the reading -->
  <text class="v" x="48" y="144" font-size="12" font-weight="700" letter-spacing="1">1 · THE AI DOES THE READING (MINUTES)</text>

  <rect class="card" x="48" y="164" width="200" height="200" rx="12"/>
  <text class="ink" x="70" y="198" font-size="16" font-weight="700">Deep-tier PR</text>
  <text class="muted" x="70" y="224" font-size="14">#482 · 9 files</text>
  <text class="g mono" x="70" y="248" font-size="13">+212</text>
  <text class="r mono" x="114" y="248" font-size="13">−61</text>
  <text class="muted" x="70" y="282" font-size="13">escalated by pass 2:</text>
  <text class="muted" x="70" y="302" font-size="13">a caller left behind</text>
  <rect class="vbg" x="70" y="320" width="82" height="26" rx="13"/>
  <text class="v mono" x="111" y="338" font-size="12" text-anchor="middle">tier/deep</text>

  <path class="inkline" d="M248 264 H270 V198 H286" marker-end="url(#ah)"/>
  <path class="inkline" d="M270 264 H286" marker-end="url(#ah)"/>
  <path class="inkline" d="M270 264 V330 H286" marker-end="url(#ah)"/>

  <rect class="card" x="292" y="166" width="270" height="64" rx="10"/>
  <text class="ink" x="312" y="192" font-size="15" font-weight="700">Change map</text>
  <text class="muted" x="312" y="214" font-size="13">computed from the diff, so it's exact</text>
  <rect class="card" x="292" y="240" width="270" height="64" rx="10"/>
  <text class="ink" x="312" y="266" font-size="15" font-weight="700">Brief</text>
  <text class="muted" x="312" y="288" font-size="13">the change, impact, risks, rollback</text>
  <rect class="card" x="292" y="314" width="270" height="64" rx="10"/>
  <text class="ink" x="312" y="340" font-size="15" font-weight="700">Three independent checks</text>
  <text class="muted" x="312" y="362" font-size="13">correctness · security · architecture</text>

  <path class="inkline" d="M562 198 H584 V272"/>
  <path class="inkline" d="M562 346 H584 V272"/>
  <path class="inkline" d="M562 272 H600" marker-end="url(#ah)"/>

  <!-- the reviewer brief -->
  <rect class="card vs" x="606" y="130" width="546" height="322" rx="12" stroke-width="1.5"/>
  <text class="ink" x="628" y="158" font-size="14" font-weight="700">github-actions</text>
  <text class="muted" x="736" y="158" font-size="14">Review brief (pass 3)</text>
  <line class="rule" x1="607" y1="172" x2="1151" y2="172"/>
  <text class="ink" x="628" y="200" font-size="17" font-weight="700">Review brief: 1 finding (1 critical)</text>
  <text class="ink" x="628" y="228" font-size="14"><tspan font-weight="700">The change.</tspan> Replaces <tspan class="mono" font-size="13">dismiss()</tspan> with <tspan class="mono" font-size="13">requestChanges()</tspan></text>
  <text class="ink" x="628" y="248" font-size="14">across the review flow, and removes the old endpoint.</text>
  <text class="ink" x="628" y="280" font-size="13" font-weight="700">Change map</text>
  <text class="muted mono" x="628" y="302" font-size="13">src/reviews   7 files   +180 −52</text>
  <text class="muted mono" x="628" y="322" font-size="13">src/ui        2 files    +32 −9</text>
  <rect class="abg" x="934" y="308" width="82" height="20" rx="10"/>
  <text class="a" x="975" y="322" font-size="12" font-weight="600" text-anchor="middle">⚠ deleted</text>
  <text class="ink" x="628" y="354" font-size="13" font-weight="700">Where to look first</text>
  <rect class="r" x="628" y="366" width="11" height="11" rx="2"/>
  <text class="ink" x="646" y="376" font-size="14"><tspan class="mono" font-size="13">actions.ts:88</tspan> · <tspan class="mono" font-size="13">dismiss()</tspan> is still called here</text>
  <text class="ink" x="628" y="404" font-size="14"><tspan font-weight="700">Ask the author:</tspan> should old clients still be able to dismiss?</text>
  <text class="muted" x="628" y="434" font-size="13">▸ Findings (1)     ▸ Sign-off draft, pre-filled</text>

  <!-- row 2: people do the judgment -->
  <text class="g" x="48" y="482" font-size="12" font-weight="700" letter-spacing="1">2 · PEOPLE DO THE JUDGMENT (30–60 MINUTES)</text>
  <path class="inkline" d="M879 452 V504 H153 V530" marker-end="url(#ah)"/>

  <rect class="gbg gs" x="48" y="536" width="210" height="80" rx="12" stroke-width="2"/>
  <text class="g" x="153" y="570" font-size="15" font-weight="700" text-anchor="middle">Owner + 2nd reviewer</text>
  <text class="ink" x="153" y="594" font-size="13" text-anchor="middle">start from the brief</text>

  <rect class="card" x="284" y="536" width="196" height="80" rx="12"/>
  <text class="ink" x="382" y="570" font-size="15" font-weight="700" text-anchor="middle">Verify the tests</text>
  <text class="muted" x="382" y="594" font-size="13" text-anchor="middle">would they catch a bug?</text>
  <rect class="card" x="506" y="536" width="196" height="80" rx="12"/>
  <text class="ink" x="604" y="570" font-size="15" font-weight="700" text-anchor="middle">Check contracts</text>
  <text class="muted" x="604" y="594" font-size="13" text-anchor="middle">every caller still works</text>
  <rect class="card" x="728" y="536" width="196" height="80" rx="12"/>
  <text class="ink" x="826" y="570" font-size="15" font-weight="700" text-anchor="middle">Confirm rollback</text>
  <text class="muted" x="826" y="594" font-size="13" text-anchor="middle">can we undo it in production?</text>
  <rect class="card" x="950" y="536" width="202" height="80" rx="12"/>
  <text class="ink" x="1051" y="570" font-size="15" font-weight="700" text-anchor="middle">Sign off</text>
  <text class="muted" x="1051" y="594" font-size="13" text-anchor="middle">confirm the pre-filled draft</text>

  <path class="inkline" d="M258 576 H278" marker-end="url(#ah)"/>
  <path class="inkline" d="M480 576 H500" marker-end="url(#ah)"/>
  <path class="inkline" d="M702 576 H722" marker-end="url(#ah)"/>
  <path class="inkline" d="M924 576 H944" marker-end="url(#ah)"/>

  <path class="inkline" d="M1051 616 V636" marker-end="url(#ah)"/>
  <rect class="abg as" x="890" y="642" width="262" height="40" rx="10" stroke-width="1.5"/>
  <text class="a" x="1021" y="667" font-size="14" font-weight="700" text-anchor="middle">review-gate: 2 approvals → merge</text>

  <text class="faint" x="48" y="667" font-size="13">The brief never approves or blocks; people do.</text>
  <text class="faint" x="48" y="702" font-size="13">Same example: PR #482 “Replace dismiss() with requestChanges()”. Illustrative, not a real review.</text>
</svg>
