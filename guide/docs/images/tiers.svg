<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Light review compared with deep review</title>
  <desc id="d">Light review: one approver, about 5 minutes, merges when the agent review is clean on the latest commit plus one approval. Deep review: the code owner and a second reviewer, 30 to 60 minutes, merges after two approvals of the latest commit.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #f5f7f6; } .card { fill: #ffffff; stroke: #d8dee2; } .ink { fill: #17212b; } .muted { fill: #55626e; }
    .rule { stroke: #b9c2c9; } .rulefill { fill: #b9c2c9; } .inkstroke { stroke: #17212b; } .inkfill { fill: #17212b; }
    .g { fill: #1a7f4b; } .gbg { fill: #e5f3eb; } .gs { stroke: #1a7f4b; }
    .v { fill: #5b34a3; } .vbg { fill: #eee8f8; } .vs { stroke: #5b34a3; }
    .a { fill: #8a5a00; } .abg { fill: #fbf0d9; } .as { stroke: #8a5a00; }
    .onfill { fill: #ffffff; } .onstroke { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121a21; } .card { fill: #19232c; stroke: #2b3843; } .ink { fill: #e7ecef; } .muted { fill: #9aa7b2; }
      .rule { stroke: #3d4c58; } .rulefill { fill: #3d4c58; } .inkstroke { stroke: #e7ecef; } .inkfill { fill: #e7ecef; }
      .g { fill: #4cc38a; } .gbg { fill: #15392a; } .gs { stroke: #4cc38a; }
      .v { fill: #b49af0; } .vbg { fill: #2d2547; } .vs { stroke: #b49af0; }
      .a { fill: #e2b04a; } .abg { fill: #3a2f17; } .as { stroke: #e2b04a; }
      .onfill { fill: #121a21; } .onstroke { stroke: #121a21; }
    }
  </style>
  <rect class="bg" width="1200" height="440" rx="20"/>

  <rect class="card" x="40" y="40" width="545" height="360" rx="14" stroke-width="1.5"/>
  <path class="gbg" d="M40 54 a14 14 0 0 1 14 -14 h517 a14 14 0 0 1 14 14 v62 h-545 z"/>
  <text class="g" x="68" y="88" font-size="26" font-weight="700">Light review</text>
  <text class="g" x="557" y="88" font-size="15" font-weight="700" text-anchor="end">tier/light</text>
  <g font-size="16">
    <text class="muted" x="68" y="160" font-weight="700">Who</text>
    <text class="ink" x="210" y="160">One approver</text>
    <text class="muted" x="68" y="206" font-weight="700">Time</text>
    <text class="ink" x="210" y="206">About 5 minutes</text>
    <text class="muted" x="68" y="252" font-weight="700">Merges when</text>
    <text class="ink" x="210" y="252">The agent review is clean on the</text>
    <text class="ink" x="210" y="276">latest commit, plus one approval</text>
    <text class="muted" x="68" y="322" font-weight="700">Good for</text>
    <text class="ink" x="210" y="322">Small changes to ordinary code</text>
    <text class="ink" x="210" y="346">that both AI reviews passed</text>
  </g>

  <rect class="card" x="615" y="40" width="545" height="360" rx="14" stroke-width="1.5"/>
  <path class="vbg" d="M615 54 a14 14 0 0 1 14 -14 h517 a14 14 0 0 1 14 14 v62 h-545 z"/>
  <text class="v" x="643" y="88" font-size="26" font-weight="700">Deep review</text>
  <text class="v" x="1132" y="88" font-size="15" font-weight="700" text-anchor="end">tier/deep</text>
  <g font-size="16">
    <text class="muted" x="643" y="160" font-weight="700">Who</text>
    <text class="ink" x="785" y="160">Code owner + second reviewer</text>
    <text class="muted" x="643" y="206" font-weight="700">Time</text>
    <text class="ink" x="785" y="206">30 to 60 minutes</text>
    <text class="muted" x="643" y="252" font-weight="700">Merges when</text>
    <text class="ink" x="785" y="252">Two approvals of the latest commit,</text>
    <text class="ink" x="785" y="276">including the owner on sensitive paths</text>
    <text class="muted" x="643" y="322" font-weight="700">Triggered by</text>
    <text class="ink" x="785" y="322">Sensitive paths, review setup,</text>
    <text class="ink" x="785" y="346">deleted tests, dependencies,</text>
    <text class="ink" x="785" y="370">400+ lines, forks, escalations</text>
  </g>
</svg>
