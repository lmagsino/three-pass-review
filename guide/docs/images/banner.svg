<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Three-Pass Code Review</title>
  <desc id="d">Pull requests pass through Copilot and an agent review. Most continue to a light human review; a few go to a deep review by the code owner.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #f5f7f6; } .card { fill: #ffffff; stroke: #d8dee2; } .ink { fill: #17212b; } .muted { fill: #55626e; }
    .rule { stroke: #b9c2c9; } .rulefill { fill: #b9c2c9; } .inkstroke { stroke: #17212b; } .inkfill { fill: #17212b; }
    .g { fill: #1a7f4b; } .gbg { fill: #e5f3eb; } .gs { stroke: #1a7f4b; }
    .v { fill: #5b34a3; } .vbg { fill: #eee8f8; } .vs { stroke: #5b34a3; }
    .a { fill: #8a5a00; } .abg { fill: #fbf0d9; } .as { stroke: #8a5a00; }
    .onfill { fill: #ffffff; } .onstroke { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121a21; } .card { fill: #19232c; stroke: #2b3843; } .ink { fill: #e7ecef; } .muted { fill: #9aa7b2; }
      .rule { stroke: #3d4c58; } .rulefill { fill: #3d4c58; } .inkstroke { stroke: #e7ecef; } .inkfill { fill: #e7ecef; }
      .g { fill: #4cc38a; } .gbg { fill: #15392a; } .gs { stroke: #4cc38a; }
      .v { fill: #b49af0; } .vbg { fill: #2d2547; } .vs { stroke: #b49af0; }
      .a { fill: #e2b04a; } .abg { fill: #3a2f17; } .as { stroke: #e2b04a; }
      .onfill { fill: #121a21; } .onstroke { stroke: #121a21; }
    }
  </style>
  <rect class="bg" width="1280" height="400" rx="20"/>
  <text class="ink" x="72" y="170" font-size="46" font-weight="700" letter-spacing="-0.5">Three-Pass Code Review</text>
  <text class="ink" x="72" y="222" font-size="25">AI reads every line. People own the risk.</text>
  <text class="muted" x="72" y="272" font-size="18">Copilot and an agent review every PR.</text>
  <text class="muted" x="72" y="298" font-size="18">Humans go deep only where a mistake would hurt.</text>

  <!-- incoming lane -->
  <line class="rule" x1="740" y1="210" x2="1030" y2="210" stroke-width="3" stroke-linecap="round"/>
  <g class="muted">
    <circle cx="752" cy="210" r="8"/><circle cx="776" cy="210" r="8"/><circle cx="800" cy="210" r="8"/><circle cx="824" cy="210" r="8"/>
    <circle cx="912" cy="210" r="8"/><circle cx="936" cy="210" r="8"/><circle cx="960" cy="210" r="8"/>
  </g>
  <!-- gates 1 and 2 -->
  <rect class="inkfill" x="864" y="130" width="12" height="160" rx="6"/>
  <text class="ink" x="870" y="100" font-size="15" font-weight="700" text-anchor="middle">Pass 1</text>
  <text class="muted" x="870" y="119" font-size="14" text-anchor="middle">Copilot</text>
  <rect class="inkfill" x="994" y="130" width="12" height="160" rx="6"/>
  <text class="ink" x="1000" y="100" font-size="15" font-weight="700" text-anchor="middle">Pass 2</text>
  <text class="muted" x="1000" y="119" font-size="14" text-anchor="middle">Agent review</text>

  <!-- fork -->
  <path class="gs" d="M1006 210 C1040 210 1040 160 1074 160 L1196 160" fill="none" stroke-width="3" stroke-linecap="round"/>
  <path class="vs" d="M1006 210 C1040 210 1040 262 1074 262 L1196 262" fill="none" stroke-width="3" stroke-linecap="round"/>
  <g class="g"><circle cx="1096" cy="160" r="8"/><circle cx="1120" cy="160" r="8"/><circle cx="1144" cy="160" r="8"/></g>
  <circle class="v" cx="1096" cy="262" r="8"/>
  <rect class="v" x="1134" y="236" width="12" height="52" rx="6"/>
  <text class="v" x="1140" y="226" font-size="13" font-weight="700" text-anchor="middle">Pass 3</text>
  <circle class="g" cx="1200" cy="160" r="14"/>
  <path class="onstroke" d="M1193 160 l5 5 l9 -10" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="v" cx="1200" cy="262" r="14"/>
  <path class="onstroke" d="M1193 262 l5 5 l9 -10" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="g" x="1214" y="136" font-size="15" font-weight="700" text-anchor="end">Light: one approver</text>
  <text class="v" x="1214" y="304" font-size="15" font-weight="700" text-anchor="end">Deep: owner sign-off</text>
</svg>
